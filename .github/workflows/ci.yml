name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        # `npm ci` exige lockfile 100% fechado pra TODA plataforma — achado real 2026-11-18:
        # @emnapi/* (dependência opcional nativa, resolução por SO/arch) falta pro Linux no
        # lockfile gerado em macOS, então só quebra no runner (ubuntu-latest), nunca localmente.
        # `npm install` resolve sem essa trava estrita, sem mudar nenhuma versão travada.
        run: npm install

      - name: Unit tests (Vitest)
        run: npm run test
